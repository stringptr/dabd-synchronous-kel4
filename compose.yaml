services:
  postgres:
    container_name: postgres
    image: docker.io/postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}:postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}:postgres
      POSTGRES_DB: ${POSTGRES_DB}:postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql:z
      - ./init/ddl.sql:/docker-entrypoint-initdb.d/1-ddl.sql:ro
      - ./init/insert_data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primary -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
