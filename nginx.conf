worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────────
    # Upstreams
    # ─────────────────────────────────────────────
    upstream auth_service    { server auth-service:8000;    }
    upstream product_service { server product-service:8000; }
    upstream order_service   { server order-service:8000;   }

    # ─────────────────────────────────────────────
    # Logging (structured JSON)
    # ─────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"request_id":"$request_id",'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"user_sub":"$user_sub",'
        '"user_role":"$user_role"'
        '}';

    # ─────────────────────────────────────────────
    # Rate limiting
    # ─────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ─────────────────────────────────────────────
    # Server
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name api.example.com;
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Sub  "";
        proxy_set_header X-User-Permissions "";

        access_log /var/log/nginx/access.log json_combined;
        error_log  /var/log/nginx/error.log warn;

        # ─── Common proxy headers (reused everywhere) ───────────────
        # (kept inline per location for clarity; you can also use an include file)

        # ─────────────────────────────────────────────────────────────
        # PUBLIC: auth-service (login, register, refresh …)
        # No auth_request here — these endpoints establish identity.
        # ─────────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_conn addr 5;

            proxy_pass http://auth_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ─────────────────────────────────────────────────────────────
        # PROTECTED: product-service — any authenticated user
        # ─────────────────────────────────────────────────────────────
        location /api/products/ {
            auth_request      /_auth_verify;
            auth_request_set  $user_role $upstream_http_x_user_role;
            auth_request_set  $user_sub  $upstream_http_x_user_sub;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr 20;

            proxy_pass http://product_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            # Pass identity to the downstream service
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-User-Sub  $user_sub;
        }

        # ─────────────────────────────────────────────────────────────
        # PROTECTED: order-service — admin only
        # ─────────────────────────────────────────────────────────────
        location /api/orders/ {
            auth_request      /_auth_verify;
            auth_request_set  $user_role $upstream_http_x_user_role;
            auth_request_set  $user_sub  $upstream_http_x_user_sub;

            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr 20;

            proxy_pass http://order_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-User-Sub  $user_sub;
        }

        # ─────────────────────────────────────────────────────────────
        # INTERNAL: the auth subrequest
        # NGINX calls this for every protected route.
        # It is NOT reachable from the outside.
        # ─────────────────────────────────────────────────────────────
        location = /_auth_verify {
            internal;

            # Don't forward the body (auth check is header-only)
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Content-Type   "";

            # Forward the original Authorization header
            proxy_set_header Authorization $http_authorization;

            # Useful context for auth-service logs / audit
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Request-ID      $request_id;

            proxy_pass http://auth_service/verify;
        }

        # ─────────────────────────────────────────────────────────────
        # Error handling
        # ─────────────────────────────────────────────────────────────
        limit_req_status 429;

        # Propagate 401/403 from auth-service as-is
        error_page 401 = @error401;
        error_page 403 = @error403;
        error_page 429 = @rate_limited;
        error_page 500 502 503 504 = @bad_gateway;

        location @error401 {
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }
        location @error403 {
            default_type application/json;
            return 403 '{"error":"forbidden"}';
        }
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60;
            return 429 '{"error":"too many requests"}';
        }
        location @bad_gateway {
            default_type application/json;
            return 503 '{"error":"upstream unavailable"}';
        }
    }
}
